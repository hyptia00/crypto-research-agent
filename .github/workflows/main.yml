name: Crypto Research Agent

on:
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Crypto Research Agent
        run: python agent.py
