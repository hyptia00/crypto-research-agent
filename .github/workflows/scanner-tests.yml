name: scanner-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-system.txt
      - run: python -m compileall -q system lilith.py scripts/live_smoke.py
      - run: python -m pytest -q
      - run: python scripts/live_smoke.py
